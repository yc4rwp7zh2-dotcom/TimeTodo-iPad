      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build for device (signing disabled)
        run: |
          set -o pipefail
          set +e
          xcodebuild             -project TimeTodo.xcodeproj             -scheme TimeTodo             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build > build.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo '================================================='
            echo '  编译失败！下面是全部报错行（error 汇总）'
            echo '================================================='
            grep -E "error:|Undefined symbol|Multiple commands produce|Module not found|fatal error|Assertion" build.log | sort -u | head -60 || true
            echo '================================================='
            echo '  日志最后 20 行（上下文）'
            echo '================================================='
            tail -n 20 build.log
            exit 1
          fi
          echo 'BUILD OK ✓'
          grep -c "warning:" build.log || true

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/TimeTodo.app"
          test -d "$APP"
          rm -rf Payload TimeTodo-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          rm -rf "Payload/TimeTodo.app/_CodeSignature" || true
          rm -rf "Payload/TimeTodo.app/PlugIns/TimeTodoWidget.appex/_CodeSignature" || true
          test -d "Payload/TimeTodo.app/PlugIns/TimeTodoWidget.appex"
          echo "已含小组件扩展"
          zip -qr TimeTodo-unsigned.ipa Payload
          ls -lh TimeTodo-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TimeTodo-unsigned-ipa
          path: TimeTodo-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
